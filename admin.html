<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Guest List | Delly’s Birthday Braai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#F6EFE2;--ink:#1D1B19;--soft:#5A544C;--card:#FFFBF3;--red:#D8402F;--blue:#2F55B8;--line:#1D1B19}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Work Sans',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 20px 56px}
a{color:var(--blue);font-weight:700}
h1{font:700 56px/1 'Caveat',cursive;margin:28px 0 8px}
.sub{color:var(--soft);margin:0 0 24px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:20px}
label{display:grid;gap:6px;font-weight:700}
input{font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:48px;width:100%}
button{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 16px;min-height:48px;cursor:pointer}
button.secondary{background:var(--blue)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.notice{min-height:1.5em;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:12px 10px;border-bottom:1px solid #aaa49b}
th{font-size:13px;text-transform:uppercase}
[hidden]{display:none!important}
@media(max-width:520px){h1{font-size:48px}.panel{padding:16px}th,td{padding:10px 6px}}
</style>
</head>
<body>
<main>
<a href="./">Birthday page</a>
<h1>Guest list</h1>
<p class="sub">Private RSVP names</p>
<section class="panel" id="loginPanel">
<form id="loginForm">
<label for="email">Admin email<input id="email" type="email" autocomplete="email" required></label>
<div class="actions"><button type="submit">Email me a sign-in link</button></div>
</form>
</section>
<p class="notice" id="notice" role="status" aria-live="polite"></p>
<section class="panel" id="guestPanel" hidden>
<p id="account"></p>
<div class="actions">
<button class="secondary" id="refresh" type="button">Refresh list</button>
<button class="secondary" id="download" type="button">Download names</button>
<button id="signOut" type="button">Sign out</button>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Name</th><th>RSVP</th><th>People</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL='YOUR_SUPABASE_URL';
var SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
var client=window.supabase&&SUPABASE_URL.indexOf('https://')===0&&SUPABASE_ANON_KEY.indexOf('YOUR_')!==0?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
var loginPanel=document.getElementById('loginPanel');
var guestPanel=document.getElementById('guestPanel');
var notice=document.getElementById('notice');
var rowsBody=document.getElementById('rows');
var latestRows=[];
var refreshTimer=null;

function showSession(session){
  loginPanel.hidden=!!session;
  guestPanel.hidden=!session;
  document.getElementById('account').textContent=session?'Signed in as '+(session.user.email||'admin'):'';
  if(session){
    loadRows();
    if(!refreshTimer)refreshTimer=window.setInterval(function(){loadRows(true);},15000);
  }else if(refreshTimer){
    window.clearInterval(refreshTimer);
    refreshTimer=null;
  }
}

async function loadRows(quiet){
  if(!quiet)notice.textContent='Loading guest list…';
  var result=await client.from('rsvps').select('name,status,guests,created_at').order('created_at',{ascending:true});
  if(result.error){
    latestRows=[];
    rowsBody.textContent='';
    notice.textContent='Could not load names. Check that this is the authorized admin account and that Supabase is configured.';
    return;
  }
  latestRows=result.data||[];
  rowsBody.textContent='';
  latestRows.forEach(function(row){
    var tr=document.createElement('tr');
    var name=document.createElement('td');name.textContent=row.name;
    var status=document.createElement('td');status.textContent=row.status==='yes'?'Coming':'Not coming';
    var guests=document.createElement('td');guests.textContent=String(row.guests);
    tr.append(name,status,guests);rowsBody.appendChild(tr);
  });
  notice.textContent=latestRows.length?latestRows.length+' RSVP(s)':'No RSVPs yet.';
}

document.getElementById('loginForm').addEventListener('submit',async function(event){
  event.preventDefault();
  if(!client){notice.textContent='Add the Supabase project URL and anon key to this page first.';return;}
  notice.textContent='Sending sign-in link…';
  var result=await client.auth.signInWithOtp({email:document.getElementById('email').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:window.location.href}});
  notice.textContent=result.error?'Could not send a sign-in link. Check the admin account and Supabase email settings.':'Check your email for the sign-in link.';
});

document.getElementById('refresh').addEventListener('click',loadRows);
document.getElementById('signOut').addEventListener('click',async function(){
  await client.auth.signOut();
  showSession(null);
  notice.textContent='Signed out.';
});
document.getElementById('download').addEventListener('click',function(){
  var text=latestRows.map(function(row,index){return (index+1)+'. '+row.name;}).join('\n');
  if(text)text+='\n';
  var url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
  var link=document.createElement('a');link.href=url;link.download='Dells birthday list.txt';link.click();
  URL.revokeObjectURL(url);
});

if(!client){notice.textContent='Add the Supabase project URL and anon key to this page first.';}
else{client.auth.getSession().then(function(result){showSession(result.data.session);});}
</script>
</body>
</html>
