<title>Delly’s Birthday Braai</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F6EFE2;--ink:#1D1B19;--soft:#5A544C;--card:#FFFBF3;--red:#D8402F;--blue:#2F55B8;--yellow:#F2B82E;--green:#5E9C2E;--orange:#EC7A1F;--line:#1D1B19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1815;--ink:#F6EFE2;--soft:#C9BFB0;--card:#2A2420;--line:#F6EFE2}}
:root[data-theme="dark"]{--bg:#1D1815;--ink:#F6EFE2;--soft:#C9BFB0;--card:#2A2420;--line:#F6EFE2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px 64px;overflow:hidden}
.bunting{display:block;width:100%;height:auto}
h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(56px,15vw,104px);line-height:.95;margin:8px 0 0;text-align:center}
h1 span{display:block;font-size:.5em;color:var(--blue)}
.hero{position:relative;margin:20px auto 0;max-width:560px}
.blob{position:absolute;left:6%;right:2%;top:4%;bottom:0;background:var(--red);opacity:.85;border-radius:46% 54% 40% 60%/55% 40% 60% 45%;transform:rotate(-4deg)}
.blob2{position:absolute;left:-10%;width:40%;top:-4%;height:34%;background:var(--yellow);border-radius:50%;transform:rotate(12deg);opacity:.9}
.hero img{position:relative;display:block;width:48%;height:auto}
.hero img.portrait-extra{position:absolute;right:0;top:50%;width:48%;transform:translateY(-50%)}
.tag{position:absolute;font-family:'Caveat',cursive;font-weight:700;font-size:30px;line-height:1;color:var(--ink)}
.t1{left:0;top:6%;transform:rotate(-8deg)}
.t2{right:0;top:6%;transform:rotate(7deg);text-align:right}
.badge{position:absolute;right:6%;bottom:14%;background:var(--blue);color:#FFFBF3;border:3px solid var(--yellow);border-radius:50%;width:92px;height:92px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Caveat',cursive;font-weight:700;font-size:24px;line-height:.95;transform:rotate(10deg)}
.banner{display:block;margin:28px auto 0;background:var(--orange);color:#1D1B19;font-family:'Caveat',cursive;font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1;padding:10px 26px;transform:rotate(-2deg);width:fit-content;border:3px solid #1D1B19}
.sub{text-align:center;color:var(--soft);margin:14px 0 0}
.info{display:grid;gap:12px;margin:32px 0 0}
.info div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 18px}
.info b{display:block;font-size:13px;letter-spacing:.18em;color:var(--red)}
.info span{font-size:24px;font-weight:700}
h2{font-family:'Caveat',cursive;font-size:44px;line-height:1;margin:44px 0 12px}
form{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
label{font-weight:700;display:grid;gap:6px}
input[type=text],input[type=number]{font:inherit;font-weight:500;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px;width:100%}
.opts{display:flex;gap:10px}
.opts label{flex:1;display:block}
.opts input{position:absolute;opacity:0}
.opts span{display:block;text-align:center;padding:12px;border:2px solid var(--line);border-radius:10px;min-height:48px;cursor:pointer;font-weight:700}
.opts input:checked+span{background:var(--green);color:#fff;border-color:var(--green)}
.opts input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
button{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:10px;padding:14px;min-height:52px;cursor:pointer;font-size:18px}
button.alt{background:var(--blue)}
.msg{margin:12px 0 0;font-weight:700}
[hidden]{display:none!important}
</style>
</head>

<section class="info" aria-label="Event details">

<h2>RSVP</h2>
<form id="f">
<label for="n">Your name<input id="n" type="text" autocomplete="name" maxlength="60" required placeholder="Type your name"></label>
<div class="opts" role="radiogroup" aria-label="Will you come?">
<label><input type="radio" name="s" value="yes" checked><span>I’m coming!</span></label>
<label><input type="radio" name="s" value="no"><span>Can’t make it</span></label>
</div>
<label for="g">How many people (including you)?<input id="g" type="number" min="1" max="10" value="1"></label>
<button type="submit">Send my RSVP</button>
</form>
<p class="msg" id="m" role="status"></p>
<div id="share" hidden><button class="alt" id="c" type="button">Copy my RSVP message</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sent=null;
var SUPABASE_URL='https://xkxevoudrboavmriuzih.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_8OcvW0soU7QgLkrbliZXCw_d4YZKiqy';
var db=window.supabase&&SUPABASE_URL.indexOf('https://')===0&&SUPABASE_ANON_KEY.indexOf('YOUR_')!==0?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
var f=document.getElementById('f'),m=document.getElementById('m');
f.addEventListener('submit',function(e){
  e.preventDefault();
  var name=document.getElementById('n').value.trim();if(!name)return;
  var st=f.elements['s'].value,g=Math.max(1,Math.min(10,parseInt(document.getElementById('g').value,10)||1));
  sent='RSVP for Delly’s birthday braai (24 Oct, 78 Seetuin Road): '+name+(st==='yes'?' is coming with '+g+' in total.':' can’t make it.');
  var done=function(ok){m.textContent=ok?(st==='yes'?'Thanks '+name+', see you there! 🔥':'Thanks '+name+', we’ll miss you!'):'Couldn’t save your RSVP. Copy your message below and send it to Delly.';document.getElementById('share').hidden=ok;};
  if(db){db.from('rsvps').insert({name:name,status:st,guests:g}).then(function(result){if(result.error)throw result.error;done(true);f.reset();}).catch(function(){done(false);});}
  else done(false);
});
document.getElementById('c').addEventListener('click',function(){
  var b=this;try{navigator.clipboard.writeText(sent).then(function(){b.textContent='Copied!';},function(){b.textContent=sent;});}catch(e){b.textContent=sent;}
});
</script>
